<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ARKENVEIL: SIGILS &amp; JOURNEYS — 3D Action RPG</title>
  <link rel="stylesheet" href="/src/ui/styles.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #08090d;
      color: #f0e6d2;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #canvas-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #floating-combat-text {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }
    #hud-root, #ui-root {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }
    #menu-root, #modal-root {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 30;
    }
    .fct-item {
      position: absolute;
      transform: translate(-50%, -50%);
      font-weight: 800;
      font-size: 18px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.95), 0 0 8px rgba(0,0,0,0.8);
      pointer-events: none;
      white-space: nowrap;
      will-change: transform, opacity;
      transition: none;
    }
    .fct-crit {
      font-size: 26px;
      color: #ffcc22;
      text-shadow: 0 0 12px rgba(255, 120, 0, 0.95), 0 2px 5px #000;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="canvas-container"></div>
    <div id="floating-combat-text"></div>
    <div id="hud-root"></div>
    <div id="ui-root"></div>
    <div id="menu-root"></div>
    <div id="modal-root"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
