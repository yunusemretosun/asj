<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ARKENVEIL: SIGILS &amp; JOURNEYS — 3D Action RPG</title>
  <link rel="stylesheet" href="/src/ui/styles.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #08090d;
      color: #f0e6d2;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #canvas-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #floating-combat-text {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
      contain: layout style;
    }
    #hud-root, #ui-root {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }
    #menu-root, #modal-root {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 30;
    }
    .fct-item {
      position: absolute;
      left: 0;
      top: 0;
      transform: translate3d(0, 0, 0) translate(-50%, -50%);
      font-weight: 800;
      font-size: 18px;
      text-shadow: 0 2px 3px rgba(0,0,0,0.95);
      pointer-events: none;
      white-space: nowrap;
      will-change: transform, opacity;
      transition: none;
    }
    .fct-crit {
      font-size: 26px;
      color: #ffcc22;
      text-shadow: 0 0 8px rgba(255, 120, 0, 0.9), 0 2px 3px #000;
    }
    #asj-boot-splash,
    #asj-loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: radial-gradient(circle at 50% 42%, #171a26 0%, #08090d 74%);
      color: #f0e6d2;
      text-align: center;
    }
    #asj-boot-splash {
      z-index: 2000;
    }
    #asj-loading-overlay {
      z-index: 1900;
      display: none;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    #asj-loading-overlay.is-visible {
      display: flex;
      opacity: 1;
      pointer-events: auto;
    }
    #asj-loading-overlay.is-fading {
      display: flex;
      opacity: 0;
      pointer-events: none;
    }
    .asj-splash-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 0.24em;
      color: #f0d799;
      text-shadow: 0 2px 18px rgba(240, 215, 153, 0.28);
    }
    .asj-splash-sub {
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #b7b0a2;
    }
    .asj-splash-bar {
      width: 180px;
      height: 3px;
      border-radius: 999px;
      background: rgba(240, 230, 210, 0.14);
      overflow: hidden;
    }
    .asj-splash-bar > i {
      display: block;
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #f0d799, transparent);
      animation: asjSplashBar 1.2s ease-in-out infinite;
    }
    @keyframes asjSplashBar {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(240%); }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="canvas-container"></div>
    <div id="floating-combat-text"></div>
    <div id="hud-root"></div>
    <div id="ui-root"></div>
    <div id="menu-root"></div>
    <div id="modal-root"></div>
    <div id="asj-boot-splash" role="status" aria-live="polite">
      <div class="asj-splash-title">ARKENVEIL</div>
      <div class="asj-splash-sub">ARKENVEIL — Loading...</div>
      <div class="asj-splash-bar"><i></i></div>
    </div>
    <div id="asj-loading-overlay" role="status" aria-live="polite" aria-hidden="true">
      <div class="asj-splash-title">ARKENVEIL</div>
      <div class="asj-splash-sub">Entering Arkenveil...</div>
      <div class="asj-splash-bar"><i></i></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
